<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bendegúz Dörnyei — Coming soon</title>
<meta name="description" content="Bendegúz (“Ben”) Dörnyei — a new version of my site is on the way.">
<!-- Keep the unfinished site OUT of search results while it's in coming-soon
     mode. Google drops the page on its next crawl, so it stops ranking under
     your name. The real index.html has no such tag, so when you switch back to
     live mode the full site becomes indexable again. -->
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2420;
    --paper:#E7EAE1;
    --card:#F3F5EF;
    --paprika:#C1440E;
    --gold:#B98A1F;
    --forest:#2F4A3D;
    --slate:#55625C;
    --line: rgba(27,36,32,0.14);
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }
  body{
    margin:0;
    min-height:100vh;
    background:var(--paper);
    color:var(--ink);
    font-family:'Public Sans', system-ui, sans-serif;
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
  }
  a{color:inherit;}

  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:64px 28px;
    position:relative;
    overflow:hidden;
  }
  .inner{max-width:640px; width:100%; position:relative; z-index:2;}

  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    letter-spacing:0.09em;
    text-transform:uppercase;
    color:var(--paprika);
    margin-bottom:22px;
  }
  h1{
    font-family:'Newsreader', Georgia, serif;
    font-weight:500;
    margin:0;
    letter-spacing:-0.01em;
    font-size:clamp(40px, 8vw, 72px);
    line-height:1.0;
  }
  h1 em{font-style:italic; font-weight:400; color:var(--forest);}
  .status{
    margin-top:28px;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    letter-spacing:0.05em;
    color:var(--slate);
    display:inline-flex;
    align-items:center;
    gap:10px;
  }
  .status .dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--paprika);
    box-shadow:0 0 0 4px rgba(193,68,14,0.16);
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }

  .lede{
    max-width:520px;
    margin-top:26px;
    font-size:19px;
    color:var(--ink);
  }
  .contact{
    margin-top:40px;
    display:flex;
    gap:14px 26px;
    flex-wrap:wrap;
    align-items:center;
  }
  .contact a{
    text-decoration:none;
    font-size:15px;
    color:var(--ink);
    border-bottom:1px solid var(--line);
    padding-bottom:2px;
    transition:border-color .2s ease, color .2s ease;
  }
  .contact a:hover, .contact a:focus-visible{ border-color:var(--paprika); color:var(--paprika); }

  /* signature flourish, echoing the main site */
  .thread-svg{
    position:absolute;
    right:-40px;
    top:50%;
    transform:translateY(-50%);
    width:340px; height:340px;
    opacity:0.85;
    z-index:1;
    pointer-events:none;
  }
  .thread-svg path{
    fill:none;
    stroke:var(--paprika);
    stroke-width:2;
    stroke-linecap:round;
    stroke-dasharray:520;
    stroke-dashoffset:520;
    animation:draw 2.6s ease forwards 0.3s;
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  @media (max-width:820px){ .thread-svg{display:none;} }

  footer{
    padding:0 28px 34px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--slate);
  }

  a:focus-visible{outline:2px solid var(--paprika); outline-offset:3px;}
</style>
</head>
<body>

<main>
  <div class="inner">
    <div class="eyebrow">Global Affairs · Statistics &amp; Data Science</div>
    <h1>Bendegúz<br><em>Dörnyei</em></h1>
    <div class="status"><span class="dot"></span> Site coming soon</div>
    <p class="lede">A new version of my site is on the way. In the meantime, the best way to reach me is directly.</p>
    <div class="contact">
      <a href="mailto:ben.dornyei@gmail.com">ben.dornyei@gmail.com</a>
      <a href="https://www.linkedin.com/in/ben-dornyei/" target="_blank" rel="noopener">LinkedIn ↗</a>
    </div>
  </div>

  <svg class="thread-svg" viewBox="0 0 150 150" aria-hidden="true">
    <path d="M10,110 C40,110 30,60 60,60 C85,60 75,20 100,20 C115,20 118,35 132,32" />
  </svg>
</main>

<footer>© 2026 Bendegúz Dörnyei</footer>

</body>
</html>
